# Pytest configuration for the unit test suite (see docs/testing.md).
#
# A standalone pytest.ini rather than pyproject.toml: the project ships no
# packaging metadata, so there is nothing else for a pyproject to hold.

[pytest]
testpaths = tests
python_files = test_*.py

# -q keeps the default run terse; -ra still surfaces the reason for anything
# skipped or xfailed. Strict markers turn a typo'd marker into an error.
addopts = -q -ra --strict-markers

filterwarnings =
    # Turn warnings from our own code into failures; leave third-party noise alone.
    default
    error::DeprecationWarning:llmproxy.*
