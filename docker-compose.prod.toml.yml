# Production compose — multi-provider from providers.toml.
#
# Serves several upstreams at once (OpenAI-compatible, Azure, Anthropic, Gemini).
# providers.toml defines the providers and their models; secrets stay in .env and
# are referenced from the TOML as ${ENV_VAR}, so both files are needed at runtime:
#   - .env            -> API keys (NVIDIA_API_KEY, ANTHROPIC_API_KEY, ...) + tuning
#   - providers.toml  -> provider/model declarations (mounted read-only)
#
# Generate a starting providers.toml first (see docs/migration.md):
#   make migrate-config-docker            # or: python -m llmproxy.scripts.env_to_toml -
#
#   docker compose -f docker-compose.prod.toml.yml up -d
#
# Pin the image with LLMPROXY_VERSION (defaults to :latest).
---
services:
  llmproxy:
    image: lordraw/llmproxy:${LLMPROXY_VERSION:-latest}
    container_name: llmproxy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Point llmproxy at the mounted providers.toml (this takes precedence over
      # the NVIDIA_* env vars).
      PROVIDERS_CONFIG: /config/providers.toml
      # WEB_CONCURRENCY x THREADS is the ceiling on requests served at once
      # (4 x 32 = 128 here). A completion holds its thread blocked on the
      # upstream for the whole generation, so size THREADS on the concurrency
      # you need, not on the core count. UPSTREAM_POOL_SIZE follows THREADS.
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-4}"
      THREADS: "${THREADS:-32}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-600}"
    volumes:
      # Host providers.toml -> container path referenced by PROVIDERS_CONFIG.
      - ./providers.toml:/config/providers.toml:ro
      # Audit trail (AUDIT_ENABLED): AUDIT_FILE defaults to logs/audit.jsonl
      # inside the container, so without this bind mount the records live in the
      # container layer and are lost when it is recreated. With several workers
      # put {pid} in AUDIT_FILE — they append to one file but cannot coordinate
      # rotation. The file holds conversations in clear text unless
      # AUDIT_BODIES=none: protect the directory and give it a retention policy.
      - ./logs:/app/logs
    # Keep the port on loopback behind a TLS-terminating reverse proxy; set
    # PROXY_API_KEY in .env for inbound auth.
    ports:
      - "127.0.0.1:${PORT:-11434}:${PORT:-11434}"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ.get(\"PORT\",\"11434\")}/health')"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
