# Production compose — single provider from environment variables (.env).
#
# Zero-config classic setup: the NVIDIA_* vars in .env synthesize a single
# upstream provider. No providers.toml is involved. Use this when you proxy to
# one OpenAI-compatible endpoint (NVIDIA by default).
#
#   docker compose -f docker-compose.prod.env.yml up -d
#
# Pin the image with LLMPROXY_VERSION (defaults to :latest). Keep .env — which
# holds NVIDIA_API_KEY / PROXY_API_KEY — out of version control.
---
services:
  llmproxy:
    image: lordraw/llmproxy:${LLMPROXY_VERSION:-latest}
    container_name: llmproxy
    restart: unless-stopped
    env_file:
      - .env
    # Production hardening: set PROXY_API_KEY in .env and keep the port on a
    # private interface behind a TLS-terminating reverse proxy. Bind to loopback
    # so the container is not reachable directly from the network.
    ports:
      - "127.0.0.1:${PORT:-11434}:${PORT:-11434}"
    # gunicorn tuning (also settable in .env). Sensible production defaults:
    environment:
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-4}"
      THREADS: "${THREADS:-8}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-600}"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ.get(\"PORT\",\"11434\")}/health')"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
